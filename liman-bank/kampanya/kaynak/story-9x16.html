<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Instagram story 1080×1920 (9:16) — üst 250px ve alt 340px yazısız güvenli bölge */
  :root {
    --metin-ana: #0E2A47;
    --metin-ikincil: #5E7080;
    --eylem: #0B7A70;
    --eylem-ustu-metin: #FFFFFF;
    --kum: #F4F1EA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Manrope', sans-serif;
    background: var(--kum);
  }
  .arka { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ic { position: absolute; inset: 0; }
  /* Üst güvenli bölge: 250px yazısız */
  .ust-izge { position: absolute; top: 250px; left: 84px; right: 84px; }
  .rozet {
    display: inline-block;
    font-size: 27px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
    color: var(--eylem);
    background: rgba(255,255,255,.82);
    padding: 14px 30px; border-radius: 99px;
  }
  h1 { margin-top: 26px; font-size: 88px; line-height: 1.1; font-weight: 800; letter-spacing: -2px; color: var(--metin-ana); }
  h1 .vurgu { color: var(--eylem); }
  p.ana { margin-top: 24px; font-size: 34px; line-height: 1.45; font-weight: 600; color: var(--metin-ikincil); max-width: 900px; }
  p.ana b { color: var(--metin-ana); font-weight: 800; }
  /* Alt güvenli bölge: 340px yazısız — içerik onun üstünde biter */
  .alt-izge {
    position: absolute; bottom: 384px; left: 84px; right: 84px;
    display: flex; flex-direction: column; gap: 22px; align-items: flex-start;
  }
  .dugme {
    display: inline-block;
    background: var(--eylem); color: var(--eylem-ustu-metin);
    font-size: 34px; font-weight: 800;
    padding: 28px 62px; border-radius: 40px;
  }
  .not { font-size: 24px; font-weight: 600; color: var(--metin-ikincil); }
  .kucuk { position: absolute; left: 84px; bottom: 356px; font-size: 19px; font-weight: 500; color: var(--metin-ikincil); }
</style>
</head>
<body>
  <img class="arka" src="kaynak/story-9x16.png" alt="">
  <div class="ic">
    <div class="ust-izge">
      <span class="rozet">Yeni · Birikim Hedefi</span>
      <h1>Hedefini koy,<br><span class="vurgu">yola çık.</span></h1>
      <p class="ana">Tutarını ve tarihini seç, <b>aktarım her ay otomatik işler</b>. Küçük adımlar büyük yolculuklara yeter.</p>
    </div>
    <div class="alt-izge">
      <span class="dugme">Hedefini kur</span>
      <span class="not">2 Kasım'da Liman Mobil'de</span>
    </div>
  </div>
  <span class="kucuk">Kurgusal senaryo, eğitim amaçlı · Liman Bank kurgusal bir bankadır</span>
</body>
</html>

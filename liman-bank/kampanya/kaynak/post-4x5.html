<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Instagram post 1080×1350 (4:5) — metin katmanı HTML'de, görsel yazısız */
  :root {
    --metin-ana: #0E2A47;
    --metin-ikincil: #5E7080;
    --eylem: #0B7A70;
    --eylem-ustu-metin: #FFFFFF;
    --kum: #F4F1EA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Manrope', sans-serif;
    background: var(--kum);
  }
  .arka { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ic {
    position: absolute; inset: 0;
    padding: 96px 84px;
    display: flex; flex-direction: column;
  }
  .rozet {
    align-self: flex-start;
    font-size: 26px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
    color: var(--eylem);
    background: rgba(255,255,255,.82);
    padding: 14px 30px; border-radius: 99px;
  }
  .govde { margin-top: auto; max-width: 840px; }
  h1 { font-size: 92px; line-height: 1.08; font-weight: 800; letter-spacing: -2px; color: var(--metin-ana); }
  h1 .vurgu { color: var(--eylem); }
  p.ana { margin-top: 30px; font-size: 38px; line-height: 1.45; font-weight: 600; color: var(--metin-ikincil); }
  p.ana b { color: var(--metin-ana); font-weight: 800; }
  .dugme-satiri { margin-top: 46px; display: flex; align-items: center; gap: 30px; }
  .dugme {
    display: inline-block;
    background: var(--eylem); color: var(--eylem-ustu-metin);
    font-size: 34px; font-weight: 800;
    padding: 28px 62px; border-radius: 40px;
  }
  .not { font-size: 24px; font-weight: 600; color: var(--metin-ikincil); }
  .kucuk { position: absolute; left: 84px; bottom: 46px; font-size: 19px; font-weight: 500; color: var(--metin-ikincil); }
</style>
</head>
<body>
  <img class="arka" src="kaynak/post-4x5.png" alt="">
  <div class="ic">
    <span class="rozet">Yeni · Birikim Hedefi</span>
    <div class="govde">
      <h1>Hedefini koy,<br><span class="vurgu">yola çık.</span></h1>
      <p class="ana">Tutarını ve tarihini seç, <b>her ayın seçtiğin gününde</b> aktarım otomatik işler. Adım adım ilerleme.</p>
      <div class="dugme-satiri">
        <span class="dugme">Hedefini kur</span>
        <span class="not">2 Kasım'da Liman Mobil'de</span>
      </div>
    </div>
  </div>
  <span class="kucuk">Kurgusal senaryo, eğitim amaçlı · Liman Bank kurgusal bir bankadır</span>
</body>
</html>

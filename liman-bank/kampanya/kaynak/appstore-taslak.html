<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root { --metin-ana:#0E2A47; --ikincil:#5E7080; --eylem:#0B7A70; --vurgu:#1FBFAE; --kum:#F4F1EA; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1206px;height:2622px;overflow:hidden}
body{font-family:'Manrope',sans-serif;background:var(--kum);display:flex;flex-direction:column;align-items:center;position:relative}
.baslik{margin-top:150px;font-size:104px;font-weight:800;letter-spacing:-2px;color:var(--metin-ana);text-align:center;line-height:1.14}
.telefon{margin-top:90px;width:960px;height:2100px;border-radius:120px;border:12px solid rgba(14,42,71,.16);background:#fff;padding:34px;box-shadow:0 44px 90px -40px rgba(14,42,71,.45)}
.telefon .ekran{width:100%;height:100%;border-radius:92px;overflow:hidden}
.telefon .ekran img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.alt-not{position:absolute;bottom:56px;font-size:30px;font-weight:600;color:var(--ikincil)}
</style></head>
<body>
<div class="baslik">İlerlemen her adımda<br>gözünün önünde.</div>
<div class="telefon"><div class="ekran"><img src="appstore/detay.png"></div></div>
<div class="alt-not">Kurgusal senaryo, eğitim amaçlı</div>
</body></html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liman · Birikim Hedefi · İllüstrasyon seti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --turkuaz: #1FBFAE;
    --eylem-koyu: #0B7A70;
    --lacivert: #0E2A47;
    --kum: #F4F1EA;
    --ikincil: #5E7080;
    --kenarlik: rgba(14, 42, 71, 0.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Manrope', sans-serif;
    background: var(--kum);
    color: var(--lacivert);
    min-height: 100vh;
    padding: 48px 32px 56px;
  }
  .ic { max-width: 1080px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 36px; }
  header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.3px; }
  header p { margin-top: 8px; font-size: 14px; color: var(--ikincil); }
  .izgara {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
  }
  .kart {
    background: #fff;
    border: 1px solid var(--kenarlik);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 14px 30px -16px rgba(11, 122, 112, .30);
  }
  .kart img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; }
  .kart .ad { padding: 10px 14px; font-size: 13px; font-weight: 800; border-top: 1px solid var(--kenarlik); }
  .kart .ad small { display: block; font-weight: 600; color: var(--ikincil); margin-top: 2px; }
  @media (max-width: 900px) { .izgara { grid-template-columns: repeat(2, 1fr); } }
  .not { margin-top: 30px; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--ikincil); }
</style>
</head>
<body>
<div class="ic">
  <header>
    <h1>Birikim Hedefi · İllüstrasyon seti</h1>
    <p>Sekiz görsel, tek el: tatil referans, aynı palet ve doku.</p>
  </header>
  <div class="izgara">
    <div class="kart"><img src="tatil.png" alt="Tatil"><div class="ad">Tatil<small>stil referansı</small></div></div>
    <div class="kart"><img src="ev.png" alt="Ev"><div class="ad">Ev</div></div>
    <div class="kart"><img src="egitim.png" alt="Eğitim"><div class="ad">Eğitim</div></div>
    <div class="kart"><img src="araba.png" alt="Araba"><div class="ad">Araba</div></div>
    <div class="kart"><img src="dugun.png" alt="Düğün"><div class="ad">Düğün</div></div>
    <div class="kart"><img src="acil-durum.png" alt="Acil durum fonu"><div class="ad">Acil durum fonu</div></div>
    <div class="kart"><img src="bos-durum.png" alt="Boş durum"><div class="ad">Boş durum<small>ana sayfa, hedef yok</small></div></div>
    <div class="kart"><img src="basari.png" alt="Başarı"><div class="ad">Başarı<small>hedef kuruldu</small></div></div>
  </div>
  <p class="not">Kurgusal senaryo, eğitim amaçlı.</p>
</div>
</body>
</html>

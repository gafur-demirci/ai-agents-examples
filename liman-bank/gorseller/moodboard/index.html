<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liman Bank · Birikim Hedefi · Moodboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --turkuaz: #1FBFAE;
    --lacivert: #0E2A47;
    --kum: #F4F1EA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Manrope', sans-serif;
    background: var(--kum);
    color: var(--lacivert);
    min-height: 100vh;
  }
  header {
    max-width: 1280px;
    margin: 0 auto;
    padding: 48px 32px 8px;
  }
  h1 {
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.5px;
  }
  header p {
    margin-top: 8px;
    font-size: 15px;
    font-weight: 400;
    opacity: 0.75;
  }
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 32px 32px 64px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }
  section.satir {
    display: grid;
    grid-template-columns: 220px repeat(4, 1fr);
    gap: 20px;
    align-items: center;
  }
  .yon-bilgi h2 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .yon-bilgi .soz {
    margin-top: 10px;
    font-size: 14.5px;
    line-height: 1.5;
    font-weight: 400;
  }
  .yon-bilgi .soz::before {
    content: "";
    display: block;
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--turkuaz);
    margin-bottom: 12px;
  }
  .kare {
    aspect-ratio: 4 / 5;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 10px rgba(14, 42, 71, 0.08), 0 12px 32px rgba(14, 42, 71, 0.10);
  }
  .kare img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  @media (max-width: 960px) {
    section.satir {
      grid-template-columns: 1fr 1fr;
    }
    .yon-bilgi {
      grid-column: 1 / -1;
    }
  }
  @media (max-width: 560px) {
    section.satir {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<header>
  <h1>Birikim Hedefi · Moodboard</h1>
  <p>Üç yön, dört kare: sahne · nesne · doku ve malzeme · ışık ve renk</p>
</header>
<main>
  <section class="satir">
    <div class="yon-bilgi">
      <h2>Koruyucu</h2>
      <p class="soz">"Birikimin güvende, adım adım."</p>
    </div>
    <div class="kare"><img src="koruyucu-1.png" alt="Koruyucu 1 · Sahne: limanda güvenli tekne"></div>
    <div class="kare"><img src="koruyucu-2.png" alt="Koruyucu 2 · Nesne: çanakta fidan"></div>
    <div class="kare"><img src="koruyucu-3.png" alt="Koruyucu 3 · Doku: keçe katmanlar"></div>
    <div class="kare"><img src="koruyucu-4.png" alt="Koruyucu 4 · Işık ve renk: kemeren sıcak ışığı"></div>
  </section>
  <section class="satir">
    <div class="yon-bilgi">
      <h2>Kâşif</h2>
      <p class="soz">"Hedefini koy, yola çık."</p>
    </div>
    <div class="kare"><img src="kasif-1.png" alt="Kâşif 1 · Sahne: pruvada figür"></div>
    <div class="kare"><img src="kasif-2.png" alt="Kâşif 2 · Nesne: pusula"></div>
    <div class="kare"><img src="kasif-3.png" alt="Kâşif 3 · Doku: kâğıt kesme dalgalar"></div>
    <div class="kare"><img src="kasif-4.png" alt="Kâşif 4 · Işık ve renk: sabah ferahlığı"></div>
  </section>
  <section class="satir">
    <div class="yon-bilgi">
      <h2>Bilge</h2>
      <p class="soz">"Ne kadar, ne zaman, net."</p>
    </div>
    <div class="kare"><img src="bilge-1.png" alt="Bilge 1 · Sahne: ölçülü iskele"></div>
    <div class="kare"><img src="bilge-2.png" alt="Bilge 2 · Nesne: rakamsız cetvel"></div>
    <div class="kare"><img src="bilge-3.png" alt="Bilge 3 · Doku: kil sütun grafiği"></div>
    <div class="kare"><img src="bilge-4.png" alt="Bilge 4 · Işık ve renk: kesişen çizgiler"></div>
  </section>
</main>
</body>
</html>
